name: Build and publish research atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check interactive model contracts
        run: |
          npm test
          python3 research/verify_rounds.py
          python3 research/nanoparticles/verify.py
          python3 scripts/verify_continuation.py
          python3 research/sound-lab-v4/verify.py
          python3 scripts/verify_field_notes.py
      - name: Assemble immutable source snapshots
        run: python3 scripts/build_site.py --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
