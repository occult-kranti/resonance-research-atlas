<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">Supported motion is a force-and-energy question</title>
<desc id="desc">Separate particle forces, support recoil, instrument artifacts and stored energy before interpreting a residual.. Proposed measurement logic; no apparatus built. Solid arrows show model or measurement dependence. Dashed arrows show a candidate process or proposed control.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087b82"/></marker><marker id="arrgold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#ab6b13"/></marker></defs>
<rect width="1400" height="950" fill="#f5f3ea"/>
<text x="55" y="46" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087b82" font-weight="700" text-anchor="start">HN-F  /  HISTORICAL CLUE → MODERN MEASUREMENT</text>
<text x="55" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#182e3e" font-weight="700" text-anchor="start">Supported motion is a force-and-energy question</text>
<text x="55" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Separate particle forces, support recoil, instrument artifacts and stored energy before interpreting a residual.</text>
<rect x="55" y="158" width="1290" height="43" rx="0" fill="#f7ecd5" stroke="#aac0c7" stroke-width="1.5"/>
<text x="75" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">PROPOSAL · measurement design · apparatus not built · no empirical result shown</text>
<rect x="55" y="225" width="620" height="321" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="78" y="263" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">FORCE OBSERVABLE / calibrated displacement</text>
<circle cx="357" cy="384" r="25" fill="#087b82" fill-opacity="0.85"/>
<path d="M357,359 L357,300" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="384" y="315" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#087b82" font-weight="400" text-anchor="start">applied support force [N]</text>
<path d="M357,410 L357,472" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="384" y="465" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#087b82" font-weight="400" text-anchor="start">weight mg [N]</text>
<path d="M327,384 L210,384" fill="none" stroke="#ab6b13" stroke-width="2.8" marker-end="url(#arrgold)" stroke-dasharray="8 6"/>
<text x="90" y="418" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#ab6b13" font-weight="400" text-anchor="start">rival: streaming drag [N]</text>
<text x="78" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#486273" font-weight="400" text-anchor="start">Also audit buoyancy, thermal drift and support recoil.</text>
<rect x="725" y="225" width="620" height="321" rx="14" fill="#e5f1ef" stroke="#aac0c7" stroke-width="1.5"/>
<text x="747" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#182e3e" font-weight="700" text-anchor="start">CONTROLS / each tests a particular mechanism</text>
<text x="747" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Source off: does suspension persist?</text>
<text x="747" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Field reversal: does the force reverse as predicted?</text>
<text x="747" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Orientation / flow / pressure: test environment.</text>
<text x="747" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Matched-temperature dummy: probe thermal drift.</text>
<text x="747" y="410" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Calibrated uncertainty: define the residual first.</text>
<text x="747" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">None alone identifies a new gravitational force.</text>
<rect x="55" y="582" width="350" height="157" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="77" y="617" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">INPUT / complete boundary</text>
<text x="77" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Electrical + optical + thermal</text>
<text x="77" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#486273" font-weight="400" text-anchor="start">Power [W] integrated over time</text>
<text x="77" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Initial stored energy [J]</text>
<rect x="480" y="582" width="380" height="157" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="502" y="617" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#182e3e" font-weight="700" text-anchor="start">ACCOUNTING / all terms in J</text>
<text x="502" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">E_in + E_initial</text>
<text x="502" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start"> = E_out + E_final + E_loss</text>
<text x="502" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#486273" font-weight="400" text-anchor="start">A short pulse can release storage.</text>
<rect x="935" y="582" width="410" height="157" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="957" y="617" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#182e3e" font-weight="700" text-anchor="start">OBSERVABLE / bounded residual</text>
<text x="957" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#486273" font-weight="400" text-anchor="start">Source, load and heat measurements</text>
<text x="957" y="680" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Endpoint storage and bandwidth</text>
<text x="957" y="709" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#486273" font-weight="400" text-anchor="start">Missing term before new mechanism</text>
<path d="M405,660 L480,660" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<path d="M860,660 L935,660" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="55" y="792" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#182e3e" font-weight="700" text-anchor="start">Tesla’s cited collector has external input; his cited aircraft uses powered air reaction.</text>
<text x="55" y="847" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">Falsifier: a specified force or energy model must fail its targeted controls before a stronger model is proposed.</text>
<text x="55" y="885" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">Sources: NH10–NH11 Tesla patent proposals; NH21 NASA staged research framework. No apparatus or propulsion test built.</text>
<path d="M60,919 L102,919" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="116" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">model / measurement dependence</text>
<path d="M600,919 L642,919" fill="none" stroke="#ab6b13" stroke-width="2.8" marker-end="url(#arrgold)" stroke-dasharray="8 6"/>
<text x="658" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">candidate process / proposed control</text>
</svg>
