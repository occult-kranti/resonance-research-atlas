<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">Loss per cycle is not power per second</title>
<desc id="desc">Declared weak-drive Debye model: fixed field amplitude, susceptibility and relaxation time.. Proposed measurement logic; no apparatus built. Solid arrows show model or measurement dependence. Dashed arrows show a candidate process or proposed control.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087b82"/></marker><marker id="arrgold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#ab6b13"/></marker></defs>
<rect width="1400" height="950" fill="#f5f3ea"/>
<text x="55" y="46" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087b82" font-weight="700" text-anchor="start">HN-A  /  HISTORICAL CLUE → MODERN MEASUREMENT</text>
<text x="55" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#182e3e" font-weight="700" text-anchor="start">Loss per cycle is not power per second</text>
<text x="55" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Declared weak-drive Debye model: fixed field amplitude, susceptibility and relaxation time.</text>
<rect x="55" y="158" width="1290" height="43" rx="0" fill="#f7ecd5" stroke="#aac0c7" stroke-width="1.5"/>
<text x="75" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">PROPOSAL · measurement design · apparatus not built · no empirical result shown</text>
<rect x="55" y="225" width="360" height="160" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="77" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#182e3e" font-weight="700" text-anchor="start">INPUT / declared conditions</text>
<text x="77" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">H peak [A/m] · f [Hz]</text>
<text x="77" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">χ₀ dimensionless · τ [s]</text>
<text x="77" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">x = 2πfτ; sample volume basis</text>
<rect x="480" y="225" width="365" height="160" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="502" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">MODEL / phase lag</text>
<text x="502" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">χ″ = χ₀x / (1 + x²)</text>
<text x="502" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">w = πμ₀H²χ″ [J/m³]</text>
<text x="502" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">p = f w [W/m³]</text>
<rect x="910" y="225" width="435" height="160" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="932" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">OBSERVABLE / two quantities</text>
<text x="932" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Cycle-loop area and average heat</text>
<text x="932" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Calibrate H at the sample</text>
<text x="932" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Do not substitute the drive dial</text>
