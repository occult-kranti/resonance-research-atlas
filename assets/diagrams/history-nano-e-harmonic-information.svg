<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">More harmonics do not guarantee more information</title>
<desc id="desc">System-matrix reconstruction needs independent sensitivity, calibrated channel units and a noise model.. Proposed measurement logic; no apparatus built. Solid arrows show model or measurement dependence. Dashed arrows show a candidate process or proposed control.</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#087b82"/></marker><marker id="arrgold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#ab6b13"/></marker></defs>
<rect width="1400" height="950" fill="#f5f3ea"/>
<text x="55" y="46" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#087b82" font-weight="700" text-anchor="start">HN-E  /  HISTORICAL CLUE → MODERN MEASUREMENT</text>
<text x="55" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#182e3e" font-weight="700" text-anchor="start">More harmonics do not guarantee more information</text>
<text x="55" y="133" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">System-matrix reconstruction needs independent sensitivity, calibrated channel units and a noise model.</text>
<rect x="55" y="158" width="1290" height="43" rx="0" fill="#f7ecd5" stroke="#aac0c7" stroke-width="1.5"/>
<text x="75" y="187" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">PROPOSAL · measurement design · apparatus not built · no empirical result shown</text>
<rect x="55" y="225" width="370" height="180" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="77" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">INPUT / excitation and sample</text>
<text x="77" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">H(t) [A/m] · f [Hz]</text>
<text x="77" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">c: concentration vector [mg/L]</text>
<text x="77" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#486273" font-weight="400" text-anchor="start">Geometry and reference specimens</text>
<rect x="490" y="225" width="360" height="180" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="512" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">CALIBRATED RECEIVER</text>
<text x="512" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">U [V] = A c + e</text>
<text x="512" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">A units: V / (mg/L)</text>
<text x="512" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#486273" font-weight="400" text-anchor="start">Noise covariance + feed-through</text>
<rect x="915" y="225" width="430" height="180" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="937" y="260" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">OBSERVABLE / reconstruction</text>
<text x="937" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Domain nullity = columns − rank</text>
<text x="937" y="323" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Noise-whitened sensitivity</text>
<text x="937" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Held-out prediction error</text>
<path d="M425,308 L490,308" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<path d="M850,308 L915,308" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<rect x="55" y="449" width="620" height="189" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="77" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">NEGATIVE CONTROL / duplicate information</text>
<text x="77" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Toy row: u₁ = c₁ + c₂</text>
<text x="77" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Add u₂ = 2c₁ + 2c₂: same blind direction</text>
<text x="77" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">A smoother fit is not a unique concentration.</text>
<text x="77" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Repeated data can reduce noise, not remove this kernel.</text>
<rect x="725" y="449" width="620" height="189" rx="14" fill="#e5f1ef" stroke="#aac0c7" stroke-width="1.5"/>
<text x="747" y="484" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#182e3e" font-weight="700" text-anchor="start">PROPOSED CONTROL / independent sensitivity</text>
<text x="747" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Toy extra row: u₃ = c₁ − c₂</text>
<text x="747" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Full rank only if coefficients are actually calibrated.</text>
<text x="747" y="576" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Perturb calibration; retain correlated-noise terms.</text>
<text x="747" y="605" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">Compare at equal acquisition time / noise resources.</text>
<path d="M675,541 L725,541" fill="none" stroke="#ab6b13" stroke-width="2.8" marker-end="url(#arrgold)" stroke-dasharray="8 6"/>
<rect x="55" y="680" width="1290" height="131" rx="14" fill="#fffef8" stroke="#aac0c7" stroke-width="1.5"/>
<text x="77" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#182e3e" font-weight="700" text-anchor="start">PATENT STATUS / proposed method, not an independently validated performance result</text>
<text x="77" y="749" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">CN120405529B proposes harmonic/sideband rows and inversion. Its grant records a disclosure.</text>
<text x="77" y="778" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#486273" font-weight="400" text-anchor="start">These toy equations illustrate row independence; they do not reproduce the patent’s instrument.</text>
<text x="55" y="847" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#182e3e" font-weight="700" text-anchor="start">Falsifier: added channels must improve declared identifiability or prediction under a fair resource budget.</text>
<text x="55" y="885" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">Source: NH20, patent description U = A·c. Toy rows assume a unit gain of 1 V per mg/L for the displayed coefficients.</text>
<path d="M60,919 L102,919" fill="none" stroke="#087b82" stroke-width="2.8" marker-end="url(#arr)"/>
<text x="116" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">model / measurement dependence</text>
<path d="M600,919 L642,919" fill="none" stroke="#ab6b13" stroke-width="2.8" marker-end="url(#arrgold)" stroke-dasharray="8 6"/>
<text x="658" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#486273" font-weight="400" text-anchor="start">candidate process / proposed control</text>
</svg>
