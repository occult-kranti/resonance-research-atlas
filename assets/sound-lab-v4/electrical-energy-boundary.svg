<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc"><title id="title">Series RLC energy boundary and voltage/current observation points</title><desc id="desc">An isolated low-voltage source drives a series current sensor, 1 ohm internal resistor, 10 millihenry inductor, 100 microfarad capacitor and 4 ohm load. Voltage probes measure source, capacitor and load with explicit polarities. Values belong to a synthetic contract. Source work equals load heat plus resistor loss plus electric and magnetic storage change. No physical measurements.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183c3a"/></marker></defs><rect x="0.00" y="0.00" width="1500.00" height="1100.00" rx="0" fill="#f6f1e7" stroke="#f6f1e7" stroke-width="2"/><text x="55.00" y="50.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">ELECTRICITY / R3 MODEL TOPOLOGY + PROPOSED MEASUREMENT BOUNDARY</text><text x="55.00" y="99.00" fill="#183c3a" font-size="38" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Voltage gain is not an energy surplus</text><text x="55.00" y="136.00" fill="#61736d" font-size="19" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Exact series RLC topology; numerical values below belong to the frozen simulation, not a component kit.</text><path d="M55.00,165.00 L1445.00,165.00" fill="none" stroke="#cbd7cc" stroke-width="2"/><rect x="370.00" y="220.00" width="915.00" height="480.00" rx="12" fill="#e9eee2" stroke="#cbd7cc" stroke-width="2"/><text x="395.00" y="250.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">PASSIVE LOAD + STORAGE BOUNDARY</text><path d="M220.00,350.00 L220.00,435.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M220.00,545.00 L220.00,665.00" fill="none" stroke="#183c3a" stroke-width="3"/><circle cx="220.00" cy="490.00" r="55.00" fill="#f6f1e7" stroke="#183c3a" stroke-width="3"/><path d="M182,490 C194,462 206,462 220,490 S246,518 258,490" fill="none" stroke="#183c3a" stroke-width="3"/><text x="275.00" y="471.00" fill="#183c3a" font-size="24" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">+</text><text x="275.00" y="529.00" fill="#183c3a" font-size="24" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−</text><text x="220.00" y="601.00" fill="#183c3a" font-size="23" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">vₛ(t)</text><text x="220.00" y="631.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="middle" font-family="Inter,Arial,sans-serif">isolated source</text><path d="M220.00,350.00 L390.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M220.00,665.00 L1190.00,665.00" fill="none" stroke="#183c3a" stroke-width="3"/><circle cx="390.00" cy="350.00" r="30.00" fill="#f6f1e7" stroke="#183c3a" stroke-width="2"/><text x="390.00" y="357.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">I</text><path d="M420.00,350.00 L475.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="390.00" y="303.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="middle" font-family="Inter,Arial,sans-serif">waveform current probe</text><path d="M250,312 L320,312" fill="none" stroke="#183c3a" stroke-width="3" marker-end="url(#arrow)"/><text x="281.00" y="291.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">i(t)</text><path d="M475.00,350.00 L495.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><rect x="495.00" y="332.00" width="70.00" height="36.00" rx="0" fill="#f6f1e7" stroke="#183c3a" stroke-width="2"/><path d="M565.00,350.00 L585.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="530.00" y="404.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">Rᵢ = 1 Ω</text><path d="M585.00,350.00 L650.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M650,350 C650,322 677,322 677,350 C677,322 704,322 704,350 C704,322 731,322 731,350 C731,322 758,322 758,350 " fill="none" stroke="#183c3a" stroke-width="3"/><path d="M758.00,350.00 L875.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="704.00" y="404.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">L = 10 mH</text><path d="M875.00,315.00 L875.00,385.00" fill="none" stroke="#183c3a" stroke-width="4"/><path d="M901.00,315.00 L901.00,385.00" fill="none" stroke="#183c3a" stroke-width="4"/><path d="M901.00,350.00 L1190.00,350.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="863.00" y="306.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">+</text><text x="895.00" y="306.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−</text><text x="888.00" y="404.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">C = 100 µF</text><path d="M1190.00,350.00 L1190.00,445.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M1190.00,445.00 L1190.00,465.00" fill="none" stroke="#183c3a" stroke-width="3"/><rect x="1172.00" y="465.00" width="36.00" height="105.00" rx="0" fill="#f6f1e7" stroke="#183c3a" stroke-width="2"/><path d="M1190.00,570.00 L1190.00,590.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="1225.00" y="517.50" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Rₗ = 4 Ω</text><path d="M1190.00,590.00 L1190.00,665.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M220.00,350.00 L105.00,350.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M105.00,350.00 L105.00,460.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M105.00,520.00 L105.00,665.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M105.00,665.00 L220.00,665.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M848.00,350.00 L848.00,465.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M848.00,465.00 L858.00,465.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M918.00,465.00 L940.00,465.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M940.00,465.00 L940.00,350.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M1190.00,445.00 L1370.00,445.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M1370.00,445.00 L1370.00,485.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M1370.00,545.00 L1370.00,590.00" fill="none" stroke="#237b73" stroke-width="2"/><path d="M1370.00,590.00 L1190.00,590.00" fill="none" stroke="#237b73" stroke-width="2"/><circle cx="105.00" cy="490.00" r="30.00" fill="#f6f1e7" stroke="#237b73" stroke-width="2"/><text x="105.00" y="497.00" fill="#237b73" font-size="21" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">Vₛ</text><circle cx="888.00" cy="465.00" r="30.00" fill="#f6f1e7" stroke="#237b73" stroke-width="2"/><text x="888.00" y="472.00" fill="#237b73" font-size="21" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">Vc</text><circle cx="1370.00" cy="515.00" r="30.00" fill="#f6f1e7" stroke="#237b73" stroke-width="2"/><text x="1370.00" y="522.00" fill="#237b73" font-size="21" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">Vₗ</text><text x="82.00" y="377.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">+</text><text x="82.00" y="650.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−</text><text x="826.00" y="445.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">+</text><text x="943.00" y="445.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−</text><text x="1385.00" y="472.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">+</text><text x="1385.00" y="581.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−</text><circle cx="220.00" cy="350.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><circle cx="220.00" cy="665.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><circle cx="848.00" cy="350.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><circle cx="940.00" cy="350.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><circle cx="1190.00" cy="445.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><circle cx="1190.00" cy="590.00" r="5.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><text x="440.00" y="532.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Same i(t) through Rᵢ, L, C and Rₗ</text><text x="440.00" y="566.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">V probes connect across the labelled node pairs.</text><text x="440.00" y="598.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Differential / isolated voltage acquisition assumed.</text><text x="440.00" y="629.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">No earth connection is shown or required by this model.</text><rect x="55.00" y="730.00" width="1390.00" height="113.00" rx="10" fill="#fffdf8" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="764.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">SYNCHRONIZED WAVEFORM RECORDER · KNOWN BANDWIDTH REQUIRED</text><text x="80.00" y="796.00" fill="#183c3a" font-size="20" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Log vₛ(t), i(t), Vc(t), vₗ(t) and initial / final state; check polarity, timing, loading and sensor loss.</text><text x="80.00" y="825.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Symbols mark probe locations, not slow-meter readings. Real probe burden, bandwidth and wiring losses need a separate budget.</text><rect x="55.00" y="869.00" width="1390.00" height="164.00" rx="10" fill="#e4ece1" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="908.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">ENERGY ACCOUNTING</text><text x="80.00" y="947.00" fill="#183c3a" font-size="26" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">∫ vₛ i dt = ∫ Rₗ i² dt + ∫ Rᵢ i² dt + Δ(½ L i² + ½ C Vc²)</text><text x="80.00" y="984.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Source work = load heat + internal loss + change in stored magnetic and electric energy.</text><text x="80.00" y="1014.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">At vₛ = 0 with the series loop still closed, a charged capacitor can deliver its initial stored energy to the load.</text><text x="55.00" y="1070.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Model drive: 1 V peak, ω = 1000 rad/s (159.155 Hz); 10 driven cycles, then 5 with vₛ = 0 and loop closed. No physical measurements.</text></svg>