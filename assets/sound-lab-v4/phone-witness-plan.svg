<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc"><title id="title">Two phones, one mixed recording</title><desc id="desc">Proposed, unbuilt top-view plan, not measurements. A 100 by 70 centimetre tabletop holds a 14-centimetre-diameter bowl on a 1-centimetre pad. The sample microphone is 20 centimetres from the rim; the pilot emitting port is 35 centimetres from the sample microphone. All ports are 8 centimetres above tabletop. One phone records a mixture; a second phone supplies pilot sound. R1 does not validate mono separation.</desc><rect x="0.00" y="0.00" width="1500.00" height="1120.00" rx="0" fill="#f6f1e7" stroke="#f6f1e7" stroke-width="2"/><text x="55.00" y="51.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">PROPOSED SOUND BENCH / A · LEAST MATERIALS</text><text x="55.00" y="100.00" fill="#183c3a" font-size="38" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Two phones, one mixed recording</text><text x="55.00" y="137.00" fill="#61736d" font-size="19" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Construction coordinates only · no physical measurements · all dimensions in centimetres (cm)</text><path d="M55.00,165.00 L1445.00,165.00" fill="none" stroke="#cbd7cc" stroke-width="2"/><text x="100.00" y="214.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">TOP VIEW</text><path d="M100.00,240.00 L850.00,240.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M100.00,234.00 L100.00,246.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M850.00,234.00 L850.00,246.00" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="475.00" y="230.00" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">100 cm tabletop</text><path d="M73.00,265.00 L73.00,790.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M79.00,265.00 L67.00,265.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M79.00,790.00 L67.00,790.00" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="43.00" y="527.50" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">70 cm</text><rect x="100.00" y="265.00" width="750.00" height="525.00" rx="9" fill="#fffdf8" stroke="#cbd7cc" stroke-width="2"/><path d="M175.00,790.00 L175.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M250.00,790.00 L250.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M325.00,790.00 L325.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M400.00,790.00 L400.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M475.00,790.00 L475.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M550.00,790.00 L550.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M625.00,790.00 L625.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M700.00,790.00 L700.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M775.00,790.00 L775.00,265.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,715.00 L850.00,715.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,640.00 L850.00,640.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,565.00 L850.00,565.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,490.00 L850.00,490.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,415.00 L850.00,415.00" fill="none" stroke="#e7e9de" stroke-width="1"/><path d="M100.00,340.00 L850.00,340.00" fill="none" stroke="#e7e9de" stroke-width="1"/><rect x="280.00" y="535.00" width="120.00" height="120.00" rx="4" fill="#e6dbc5" stroke="#c3b499" stroke-width="2"/><circle cx="340.00" cy="595.00" r="52.50" fill="#a9b8b3" stroke="#183c3a" stroke-width="2"/><circle cx="340.00" cy="595.00" r="49.50" fill="#e2e8df" stroke="#83958b" stroke-width="2"/><circle cx="340.00" cy="595.00" r="18.75" fill="#c9d3c9" stroke="#83958b" stroke-width="1"/><circle cx="272.00" cy="575.00" r="16.00" fill="#183c3a" stroke="#f6f1e7" stroke-width="2"/><text x="272.00" y="581.00" fill="#f6f1e7" font-size="16" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">1</text><rect x="512.50" y="272.50" width="60.00" height="67.50" rx="4" fill="#e6dbc5" stroke="#c3b499" stroke-width="2"/><rect x="514.38" y="323.50" width="56.25" height="9.00" rx="4" fill="#bad0c4" stroke="#237b73" stroke-width="2"/><path d="M532.50,332.50 L552.50,332.50" fill="none" stroke="#237b73" stroke-width="6"/><circle cx="489.50" cy="300.50" r="16.00" fill="#183c3a" stroke="#f6f1e7" stroke-width="2"/><text x="489.50" y="306.50" fill="#f6f1e7" font-size="16" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">3</text><path d="M392.50,595.00 L542.50,595.00" fill="none" stroke="#237b73" stroke-width="3" stroke-dasharray="8 7"/><path d="M542.50,332.50 L542.50,595.00" fill="none" stroke="#b57535" stroke-width="3" stroke-dasharray="8 7"/><rect x="580.00" y="557.50" width="82.50" height="75.00" rx="4" fill="#e6dbc5" stroke="#c3b499" stroke-width="2"/><rect x="542.50" y="566.88" width="112.50" height="56.25" rx="4" fill="#bad0c4" stroke="#237b73" stroke-width="2"/><rect x="557.50" y="574.38" width="82.50" height="41.25" rx="4" fill="#294c46" stroke="#237b73" stroke-width="2"/><circle cx="542.50" cy="595.00" r="6.00" fill="#237b73" stroke="#f6f1e7" stroke-width="2"/><circle cx="548.50" cy="650.00" r="16.00" fill="#183c3a" stroke="#f6f1e7" stroke-width="2"/><text x="548.50" y="656.00" fill="#f6f1e7" font-size="16" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">2</text><path d="M392.50,703.00 L542.50,703.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M392.50,697.00 L392.50,709.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M542.50,697.00 L542.50,709.00" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="467.50" y="693.00" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">20 cm rim–mic</text><path d="M287.50,525.00 L392.50,525.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M287.50,519.00 L287.50,531.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M392.50,519.00 L392.50,531.00" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="340.00" y="515.00" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">Ø14 cm</text><path d="M450.00,332.50 L450.00,595.00" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M456.00,332.50 L444.00,332.50" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M456.00,595.00 L444.00,595.00" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="487.00" y="467.75" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">35 cm</text><path d="M212.50,490.00 L287.50,520.00" fill="none" stroke="#b57535" stroke-width="10"/><circle cx="287.50" cy="520.00" r="6.00" fill="#c99278" stroke="#b57535" stroke-width="2"/><circle cx="189.50" cy="471.00" r="16.00" fill="#183c3a" stroke="#f6f1e7" stroke-width="2"/><text x="189.50" y="477.00" fill="#f6f1e7" font-size="16" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">6</text><text x="110.00" y="824.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Grid = 10 cm. All microphone / emitting ports: z = 8 cm above tabletop.</text><text x="110.00" y="850.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Bowl height 7 cm + soft support 1 cm. Port openings stay unobstructed.</text><circle cx="930.00" cy="207.00" r="15.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><text x="930.00" y="213.00" fill="#f6f1e7" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">1</text><text x="958.00" y="212.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Empty metal bowl + soft pad</text><text x="958.00" y="238.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Known intact household vessel; Ø14 × 7 cm</text><text x="958.00" y="261.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">is a drawing choice, not a tuned resonator.</text><circle cx="930.00" cy="300.00" r="15.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><text x="930.00" y="306.00" fill="#f6f1e7" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">2</text><text x="958.00" y="305.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Sample microphone</text><text x="958.00" y="331.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Face the rim; keep location and orientation.</text><text x="958.00" y="354.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">A: phone records both sources in one track.</text><circle cx="930.00" cy="393.00" r="15.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><text x="930.00" y="399.00" fill="#f6f1e7" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">3</text><text x="958.00" y="398.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Steady pilot source</text><text x="958.00" y="424.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">A second phone can use its own speaker.</text><text x="958.00" y="447.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Speaker port faces the sample microphone.</text><circle cx="930.00" cy="486.00" r="15.00" fill="#183c3a" stroke="#183c3a" stroke-width="2"/><text x="930.00" y="492.00" fill="#f6f1e7" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">6</text><text x="958.00" y="491.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Gentle tap → withdraw pencil</text><text x="958.00" y="517.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Pencil eraser gives a brief impact.</text><text x="958.00" y="540.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Save quiet pre-roll and every raw take.</text><text x="916.00" y="617.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Two phones are sufficient to explore</text><text x="916.00" y="646.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">this geometry. A separate speaker is optional.</text><text x="916.00" y="695.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Log gain, noise suppression, echo cancellation,</text><text x="916.00" y="720.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">volume, supports, timing and actual positions.</text><rect x="55.00" y="895.00" width="1390.00" height="180.00" rx="12" fill="#e4ece1" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="931.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">WHAT THIS ARRANGEMENT CAN TEST</text><text x="80.00" y="968.00" fill="#183c3a" font-size="20" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Explore whether a steady pilot and a tap decay can be captured without clipping at fixed positions.</text><text x="80.00" y="1000.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">R1 validates ideally separated model channels. This single-microphone mixture needs its own separation checks.</text><text x="80.00" y="1032.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">A drifting pilot can reflect source, room or recorder changes; a stable pilot is not a calibration certificate.</text></svg>