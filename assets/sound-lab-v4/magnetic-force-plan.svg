<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc"><title id="title">Magnet above a contacting test piece on an independently supported balance</title><desc id="desc">Proposed side elevation: a small magnet on an off-balance stand sits 8 centimetres above a steel test piece that remains on the balance pan. An independent force diagram shows upward support N, upward magnetic force F m and downward weight mg. N equals mg minus F m in static contact. No physical measurements or antigravity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183c3a"/></marker></defs><rect x="0.00" y="0.00" width="1500.00" height="1100.00" rx="0" fill="#f6f1e7" stroke="#f6f1e7" stroke-width="2"/><text x="55.00" y="50.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">MAGNETISM / PROPOSED CONTACT-FORCE CONTROL</text><text x="55.00" y="99.00" fill="#183c3a" font-size="37" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">A changed scale reading is not changed gravity</text><text x="55.00" y="136.00" fill="#61736d" font-size="19" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">The steel test piece stays on the pan. Magnet and its support are mechanically outside the balance.</text><path d="M55.00,165.00 L1445.00,165.00" fill="none" stroke="#cbd7cc" stroke-width="2"/><text x="75.00" y="218.00" fill="#237b73" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">SIDE ELEVATION · x–z PLANE</text><rect x="75.00" y="253.00" width="950.00" height="93.00" rx="8" fill="#fffdf8" stroke="#cbd7cc" stroke-width="2"/><text x="95.00" y="288.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">The magnet's opposite reaction is carried by the external stand.</text><text x="95.00" y="319.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Ordinary-force illustration only: this is not a quantitative solenoid L(x) model or an antigravity rig.</text><rect x="279.00" y="752.00" width="492.00" height="18.00" rx="2" fill="#d2ddce" stroke="#cbd7cc" stroke-width="2"/><rect x="363.00" y="698.00" width="288.00" height="54.00" rx="2" fill="#b3cbbb" stroke="#cbd7cc" stroke-width="2"/><rect x="465.00" y="692.00" width="84.00" height="6.00" rx="2" fill="#889f90" stroke="#cbd7cc" stroke-width="2"/><rect x="399.00" y="686.00" width="216.00" height="6.00" rx="2" fill="#d9e1d6" stroke="#cbd7cc" stroke-width="2"/><rect x="489.00" y="676.40" width="36.00" height="9.60" rx="2" fill="#9da9a6" stroke="#cbd7cc" stroke-width="2"/><rect x="489.00" y="573.20" width="36.00" height="7.20" rx="2" fill="#b57535" stroke="#cbd7cc" stroke-width="2"/><rect x="849.00" y="752.00" width="156.00" height="18.00" rx="2" fill="#d0c7af" stroke="#cbd7cc" stroke-width="2"/><rect x="909.00" y="440.00" width="26.40" height="312.00" rx="2" fill="#c8c7b4" stroke="#cbd7cc" stroke-width="2"/><rect x="495.00" y="444.80" width="440.40" height="19.20" rx="2" fill="#c8c7b4" stroke="#cbd7cc" stroke-width="2"/><rect x="502.20" y="464.00" width="9.60" height="109.20" rx="2" fill="#c8c7b4" stroke="#cbd7cc" stroke-width="2"/><text x="369.00" y="737.60" fill="#183c3a" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">BALANCE</text><text x="405.00" y="657.20" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">steel test piece</text><text x="543.00" y="574.40" fill="#b57535" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">small permanent magnet</text><path d="M536,523 L536,599" fill="none" stroke="#b57535" stroke-width="2" marker-end="url(#arrow)"/><text x="550.00" y="520.00" fill="#b57535" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">−Fₘ on magnet</text><text x="735.00" y="422.00" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">nonmagnetic stand</text><text x="771.00" y="395.60" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">feet off the balance</text><path d="M447.00,676.40 L447.00,580.40" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M441.00,676.40 L453.00,676.40" fill="none" stroke="#61736d" stroke-width="1.5"/><path d="M441.00,580.40 L453.00,580.40" fill="none" stroke="#61736d" stroke-width="1.5"/><text x="395.00" y="632.40" fill="#183c3a" font-size="17" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">8 cm gap</text><text x="78.00" y="820.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Nominal geometry only: pan top z = 7 cm; test top z = 7.8 cm; magnet bottom z = 15.8 cm.</text><path d="M1075.00,212.00 L1075.00,807.00" fill="none" stroke="#cbd7cc" stroke-width="2"/><text x="1120.00" y="238.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">FORCES ON TEST PIECE</text><circle cx="1225.00" cy="475.00" r="28.00" fill="#abb7ac" stroke="#183c3a" stroke-width="2"/><path d="M1194,458 L1194,345" fill="none" stroke="#237b73" stroke-width="3" marker-end="url(#arrow)"/><text x="1176.00" y="328.00" fill="#237b73" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">N</text><path d="M1257,458 L1257,290" fill="none" stroke="#b57535" stroke-width="3" marker-end="url(#arrow)"/><text x="1290.00" y="305.00" fill="#b57535" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Fₘ</text><path d="M1225,504 L1225,640" fill="none" stroke="#183c3a" stroke-width="3" marker-end="url(#arrow)"/><text x="1247.00" y="627.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">mg</text><text x="1115.00" y="692.00" fill="#183c3a" font-size="19" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Static contact model</text><text x="1115.00" y="731.00" fill="#183c3a" font-size="27" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">N = mg − Fₘ</text><text x="1115.00" y="769.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Only while N ≥ 0.</text><text x="1115.00" y="798.00" fill="#61736d" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Arrows are not to scale.</text><rect x="55.00" y="870.00" width="1390.00" height="180.00" rx="10" fill="#e4ece1" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="907.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">WHAT MUST BE CONTROLLED</text><text x="80.00" y="946.00" fill="#183c3a" font-size="19" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Record baseline → fixed magnet gap → baseline; preserve all readings and the external magnet support.</text><text x="80.00" y="980.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Field response of the balance itself, drift, table coupling and magnet forces on nearby parts can imitate a mass change.</text><text x="80.00" y="1013.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">A lighter contact-force reading does not by itself distinguish magnetic force from gravity change. No lift or antigravity is demonstrated.</text></svg>