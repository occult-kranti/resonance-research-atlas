<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc"><title id="title">Maintained-current variable-inductance source, storage and work identity</title><desc id="desc">Closed ideal circuit with maintained 0.2 ampere current, 5 ohm resistance and hypothetical inductance 0.01 plus 0.1z henries. An externally prescribed half-cosine motion moves z from zero to two centimetres over 0.2 seconds. Source work supplies resistor heat, stored magnetic energy increase and mechanical output. The source supplies forty microjoules to storage and forty microjoules to mechanical work. No measured coil or free levitation model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#183c3a"/></marker></defs><rect x="0.00" y="0.00" width="1500.00" height="1100.00" rx="0" fill="#f6f1e7" stroke="#f6f1e7" stroke-width="2"/><text x="55.00" y="50.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">MAGNETISM / R4 IDEAL ELECTROMECHANICAL MODEL</text><text x="55.00" y="99.00" fill="#183c3a" font-size="35" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Current, stored field energy and mechanical work</text><text x="55.00" y="136.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Hypothetical L(z) law with externally imposed motion; not a measured coil, free dynamics or the permanent-magnet bench.</text><path d="M55.00,165.00 L1445.00,165.00" fill="none" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="215.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">CLOSED ELECTRICAL PATH</text><circle cx="190.00" cy="465.00" r="54.00" fill="#f6f1e7" stroke="#183c3a" stroke-width="3"/><path d="M190,495 L190,436" fill="none" stroke="#183c3a" stroke-width="3" marker-end="url(#arrow)"/><path d="M190.00,411.00 L190.00,300.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M190.00,300.00 L320.00,300.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M190.00,519.00 L190.00,650.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M190.00,650.00 L620.00,650.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="75.00" y="556.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">Maintained I = 0.2 A</text><text x="75.00" y="587.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">source must supply v(t) I</text><path d="M320.00,300.00 L340.00,300.00" fill="none" stroke="#183c3a" stroke-width="3"/><rect x="340.00" y="282.00" width="90.00" height="36.00" rx="0" fill="#f6f1e7" stroke="#183c3a" stroke-width="2"/><path d="M430.00,300.00 L450.00,300.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="385.00" y="354.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="middle" font-family="Inter,Arial,sans-serif">R = 5 Ω</text><path d="M450.00,300.00 L620.00,300.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M620.00,300.00 L620.00,365.00" fill="none" stroke="#183c3a" stroke-width="3"/><path d="M620,365 C590,365 590,399 620,399 C590,399 590,433 620,433 C590,433 590,467 620,467 C590,467 590,501 620,501 " fill="none" stroke="#183c3a" stroke-width="3"/><path d="M620.00,501.00 L620.00,650.00" fill="none" stroke="#183c3a" stroke-width="3"/><text x="646.00" y="365.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">L(z) = 0.01 + 0.1z H</text><text x="646.00" y="397.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">z in m; 0 ≤ z ≤ 0.02 m</text><text x="646.00" y="446.00" fill="#237b73" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">F = ½ I² dL/dz = 2 mN</text><text x="646.00" y="480.00" fill="#183c3a" font-size="20" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">v(t) = RI + I (dL/dz) ż</text><path d="M651,568 L836,568" fill="none" stroke="#237b73" stroke-width="3" marker-end="url(#arrow)"/><text x="717.00" y="600.00" fill="#237b73" font-size="16" font-weight="normal" text-anchor="middle" font-family="Inter,Arial,sans-serif">mechanical work</text><rect x="865.00" y="495.00" width="570.00" height="185.00" rx="10" fill="#e9eee2" stroke="#cbd7cc" stroke-width="2"/><text x="890.00" y="528.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">PRESCRIBED MOTION</text><text x="890.00" y="559.00" fill="#183c3a" font-size="21" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">z(t) = 0.01 [1 − cos(πt / 0.2)] m</text><text x="890.00" y="590.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">0 ≤ t ≤ 0.2 s; starts and ends at rest.</text><text x="890.00" y="622.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">External constraint selects this trajectory.</text><text x="890.00" y="653.00" fill="#61736d" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">No claim that the model freely lifts a mass.</text><rect x="55.00" y="695.00" width="1390.00" height="195.00" rx="10" fill="#e4ece1" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="734.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">COMPLETE PORT ENERGY IDENTITY AT MAINTAINED CURRENT</text><text x="80.00" y="779.00" fill="#183c3a" font-size="29" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">vI = RI² + d(½ L I²)/dt + F ż</text><text x="80.00" y="821.00" fill="#61736d" font-size="20" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">source power = resistive heat + stored-field rate + mechanical output</text><text x="80.00" y="858.00" fill="#183c3a" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">For Δz = 2 cm: magnetic storage increases by 40 µJ and mechanical work is 40 µJ; both come from the source.</text><rect x="55.00" y="916.00" width="1390.00" height="114.00" rx="10" fill="#fffdf8" stroke="#cbd7cc" stroke-width="2"/><text x="80.00" y="952.00" fill="#237b73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Arial,sans-serif">SEPARATE STATIC CONTACT COMPARISON · STATOR REACTION SUPPORTED OFF BALANCE</text><text x="80.00" y="990.00" fill="#183c3a" font-size="20" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">At fixed g = 9.80665 m/s², a 1 g mass and upward 2 mN force give N = 7.80665 mN while contact holds.</text><text x="55.00" y="1070.00" fill="#61736d" font-size="17" font-weight="normal" text-anchor="start" font-family="Inter,Arial,sans-serif">Analytic model schematic only. Coil law, current control, trajectory and force are stipulated; no device or gravity change was measured.</text></svg>