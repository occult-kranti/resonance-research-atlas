<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc"><title id="title">Proposed concealed-target human and AI information-custody protocol</title><desc id="desc">Three lanes show offline custodian generating 80 targets in twenty shuffled four-symbol blocks, target storage and salted commitments; independent human and AI target-blind stations with an ordinary shared category prior; both timestamped guesses locked before all targets and salts reach an analyst. A separate disclosed positive-control path is excluded from the concealed phase. Protocol only, not run.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="900" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">B1–B3 PROPOSED HUMAN/AI PROTOCOL</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Concealed target · locked reports · independent scoring</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Information custody only; no higher-consciousness field or subjective-experience sensor is measured.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><rect x="53" y="158" width="298" height="570" rx="14" fill="#edf6fc"/><rect x="370" y="158" width="449" height="570" rx="14" fill="#f0f8f6"/><rect x="837" y="158" width="309" height="570" rx="14" fill="#fff6ed"/><text x="70" y="187" fill="#2563a6" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">1 · INDEPENDENT CUSTODIAN</text><text x="388" y="187" fill="#087f73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">2 · TARGET-BLIND RESPONSE STATIONS</text><text x="854" y="187" fill="#bc6836" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">3 · ANALYST AFTER FREEZE</text><rect x="68" y="214" width="265" height="84" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="84" y="244" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Offline target schedule</text><text x="84" y="270" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">80 trials; 20 shuffled 4-symbol blocks</text><rect x="68" y="341" width="265" height="86" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="84" y="371" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Opaque target store</text><text x="84" y="397" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">targets + secret high-entropy salts</text><line x1="201" y1="298" x2="201" y2="337" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="68" y="464" width="265" height="86" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="84" y="494" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Public commitment</text><text x="84" y="520" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">trial ID + salted target hash</text><line x1="201" y1="427" x2="201" y2="460" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><path d="M333 506 H363 V312 H795" fill="none" stroke="#2563a6" stroke-width="2"/><line x1="405" y1="312" x2="405" y2="342" stroke="#2563a6" stroke-width="2" marker-end="url(#blueArrow)"/><line x1="795" y1="312" x2="795" y2="342" stroke="#2563a6" stroke-width="2" marker-end="url(#blueArrow)"/><text x="605" y="332" fill="#2563a6" font-size="13" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">ID + salted hash + four labels only</text><rect x="435" y="214" width="318" height="78" rx="12" fill="#f6faf8" stroke="#e2eaf0" stroke-width="2"/><text x="451" y="244" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Ordinary shared prior U</text><text x="451" y="270" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">same category set / prompt conventions</text><line x1="453" y1="292" x2="453" y2="339" stroke="#087f73" stroke-width="2" marker-end="url(#arrow)"/><line x1="749" y1="292" x2="749" y2="339" stroke="#087f73" stroke-width="2" marker-end="url(#arrow)"/><rect x="391" y="345" width="202" height="95" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="407" y="375" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Human station</text><text x="407" y="401" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">one choice + optional text</text><rect x="607" y="345" width="202" height="95" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="623" y="375" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">AI station</text><text x="623" y="401" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">fresh context; raw output</text><text x="600" y="459" fill="#087f73" font-size="13" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">guesses hidden until lock</text><line x1="490" y1="440" x2="490" y2="501" stroke="#087f73" stroke-width="2" marker-end="url(#arrow)"/><line x1="707" y1="440" x2="707" y2="501" stroke="#087f73" stroke-width="2" marker-end="url(#arrow)"/><rect x="446" y="506" width="318" height="90" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="462" y="536" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Frozen response export</text><text x="462" y="562" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">both choices, UTC times, hashes, logs</text><line x1="764" y1="551" x2="851" y2="551" stroke="#087f73" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="852" y="479" width="278" height="144" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="868" y="509" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Verify and score</text><text x="868" y="535" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">commitments; all 80 trials</text><text x="868" y="575" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">exact within-block randomization</text><text x="868" y="597" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">agreement / added information</text><line x1="333" y1="390" x2="352" y2="390" stroke="#bc6836" stroke-width="2"/><line x1="352" y1="390" x2="352" y2="676" stroke="#bc6836" stroke-width="2"/><line x1="352" y1="676" x2="988" y2="676" stroke="#bc6836" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><line x1="988" y1="676" x2="988" y2="626" stroke="#bc6836" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="599" y="665" fill="#bc6836" font-size="14" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">targets + salts released only after BOTH reports and entire main run freeze</text><text x="391" y="630" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Designed to exclude target paths; custody audit required.</text><line x1="54" y1="759" x2="1146" y2="759" stroke="#e2eaf0" stroke-width="2"/><text x="66" y="789" fill="#bc6836" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">SEPARATE POSITIVE CONTROL</text><rect x="65" y="805" width="270" height="70" rx="12" fill="#fff0e2" stroke="#e9bd91" stroke-width="2"/><text x="81" y="835" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Disclosed target</text><text x="81" y="861" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">ordinary information path</text><line x1="336" y1="839" x2="445" y2="839" stroke="#bc6836" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="450" y="805" width="315" height="70" rx="12" fill="#fff0e2" stroke="#e9bd91" stroke-width="2"/><text x="466" y="835" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Response with known target</text><text x="466" y="861" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">validates data path and scoring</text><line x1="766" y1="839" x2="875" y2="839" stroke="#bc6836" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="879" y="805" width="253" height="70" rx="12" fill="#fff0e2" stroke="#e9bd91" stroke-width="2"/><text x="895" y="835" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Score separately</text><text x="895" y="861" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">excluded from concealed 80</text></svg>