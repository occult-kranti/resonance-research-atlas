<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc"><title id="title">Proposed suspended spoon noncontact ringdown setup</title><desc id="desc">Side elevation shows an unbroken spoon hanging loosely from thread under a crossbar 0.42 m above a padded table. Spoon bowl centre is 0.12 m high and phone mic faces it 0.20 m away without contact. A pencil eraser gives a gentle tap; capture quiet pre-roll, five separate events, a light-touch loading control and return reference.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="750" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">S2 PROPOSED BENCH / SIDE ELEVATION</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Suspended spoon · gentle tap · noncontact phone</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Nominal metre coordinates above padded tabletop. S2 synthetic decay is not an observed spoon response.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><text x="66" y="176" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">GEOMETRY</text><rect x="82" y="630" width="650" height="22" fill="#dae6ed" stroke="#879cad"/><text x="90" y="682" fill="#506477" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">padded table  z = 0</text><line x1="241" y1="211" x2="460" y2="211" stroke="#163044" stroke-width="8"/><text x="350" y="190" fill="#163044" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">crossbar  z = 0.42 m</text><line x1="350" y1="211" x2="350" y2="319" stroke="#506477" stroke-width="2" stroke-dasharray="5 4"/><text x="366" y="280" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">loose thread</text><line x1="350" y1="318" x2="350" y2="486" stroke="#2563a6" stroke-width="8"/><ellipse cx="350" cy="512" rx="30" ry="26" fill="#9ebce1" stroke="#2563a6" stroke-width="3"/><text x="273" y="506" fill="#2563a6" font-size="15" font-weight="bold" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">spoon bowl</text><text x="273" y="531" fill="#506477" font-size="13" font-weight="end" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">centre z = 0.12 m</text><rect x="577" y="455" width="20" height="109" rx="5" fill="#e5f5f2" stroke="#087f73" stroke-width="3"/><line x1="587" y1="564" x2="587" y2="630" stroke="#506477" stroke-width="3"/><rect x="555" y="620" width="65" height="10" fill="#b9cbd3"/><circle cx="577" cy="511" r="4" fill="#087f73"/><text x="610" y="503" fill="#087f73" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">phone mic → spoon</text><text x="610" y="528" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">M = (0.20, 0, 0.12) m</text><line x1="382" y1="512" x2="565" y2="512" stroke="#087f73" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="350" y1="581" x2="577" y2="581" stroke="#163044" stroke-width="1.5"/><line x1="350" y1="574" x2="350" y2="589" stroke="#163044" stroke-width="1.5"/><line x1="577" y1="574" x2="577" y2="589" stroke="#163044" stroke-width="1.5"/><text x="463" y="607" fill="#163044" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">bowl–mic = 0.20 m</text><line x1="300" y1="492" x2="325" y2="507" stroke="#bc6836" stroke-width="5"/><text x="175" y="465" fill="#bc6836" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">pencil eraser</text><line x1="170" y1="470" x2="294" y2="493" stroke="#bc6836" stroke-width="2" marker-end="url(#arrow)"/><line x1="785" y1="173" x2="785" y2="706" stroke="#e2eaf0" stroke-width="2"/><text x="810" y="178" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CAPTURE AND CONTROLS</text><rect x="811" y="206" width="325" height="80" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="827" y="236" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Quiet → tap → ringdown</text><text x="827" y="262" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">≥1 s before; ≥2 s after impact</text><line x1="972" y1="286" x2="972" y2="312" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="811" y="324" width="325" height="80" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="827" y="354" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">At least five separate taps</text><text x="827" y="380" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">retain all WAV files and clipping flags</text><line x1="972" y1="404" x2="972" y2="430" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="811" y="443" width="325" height="83" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="827" y="473" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Matched touch control</text><text x="827" y="499" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">light finger loading; phone stays fixed</text><text x="811" y="567" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Then repeat untouched references.</text><text x="811" y="612" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Fit a declared post-impact window;</text><text x="811" y="637" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">log event time, processing and gain.</text><text x="811" y="684" fill="#bc6836" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">No intrinsic material damping inferred.</text><text x="72" y="725" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">3D coordinates: thread and spoon at (0,0); bowl (0,0,0.12); phone mic (0.20,0,0.12) m.</text></svg>