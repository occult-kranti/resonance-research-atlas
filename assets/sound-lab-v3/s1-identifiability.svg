<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="title desc"><title id="title">Synthetic two-path transfer identifiability</title><desc id="desc">Two exact factorisations of the same synthetic total transfer H: device d and acoustic delayed branch e, versus device d convolved with e and identity acoustic path. The branch is 40 samples at 8 kilohertz. Proposed source, device, air and readout audit is unbuilt.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="730" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">S1A SYNTHETIC INFERENCE</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">One total transfer, multiple physical stories</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">The 5 ms branch belongs to an exact computational FIR contract, not an observed sound path.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><rect x="70" y="198" width="480" height="92" rx="12" fill="#edf6fc" stroke="#e2eaf0" stroke-width="2"/><text x="86" y="228" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Decomposition A · model</text><text x="86" y="254" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">device = d; acoustic = e = δ[n] + 0.6 δ[n−40]</text><rect x="650" y="198" width="480" height="92" rx="12" fill="#edf7f4" stroke="#e2eaf0" stroke-width="2"/><text x="666" y="228" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Decomposition B · model</text><text x="666" y="254" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">device = d * e; acoustic = δ[n]</text><line x1="312" y1="290" x2="312" y2="340" stroke="#2563a6" stroke-width="3" marker-end="url(#blueArrow)"/><line x1="889" y1="290" x2="889" y2="340" stroke="#087f73" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="350" width="720" height="100" rx="12" fill="#fff5e9" stroke="#e8c6a8" stroke-width="2"/><text x="256" y="380" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Same observable output</text><text x="256" y="406" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Y(ω)/X(ω) identifies total H, not a unique room or device factor.</text><text x="70" y="505" fill="#163044" font-size="18" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">PROPOSED PHYSICAL AUDIT</text><rect x="70" y="535" width="245" height="84" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="86" y="565" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">1. Source</text><text x="86" y="591" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">playback file and level</text><rect x="342" y="535" width="245" height="84" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="358" y="565" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">2. Device</text><text x="358" y="591" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">speaker / microphone</text><rect x="614" y="535" width="245" height="84" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="630" y="565" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">3. Air + card</text><text x="630" y="591" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">room, paths, placement</text><rect x="886" y="535" width="245" height="84" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="902" y="565" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">4. Readout</text><text x="902" y="591" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">gain / sample clock</text><line x1="316" y1="577" x2="338" y2="577" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><line x1="588" y1="577" x2="610" y2="577" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><line x1="860" y1="577" x2="882" y2="577" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="677" fill="#506477" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">d = [0.7, 0.2, 0.1]; 40 samples / 8 kHz = 5 ms only in the synthetic model.</text><text x="70" y="702" fill="#bc6836" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">No measured time zero, impulse response, or separate device calibration exists here.</text></svg>