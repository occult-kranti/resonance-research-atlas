<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 785" width="1200" height="785" role="img" aria-labelledby="title desc"><title id="title">Alchemy terms and uncertain modern chemical identity</title><desc id="desc">Conventional solar sign can indicate gold, Au, in literal metal context; Saturn can indicate lead, Pb, where a manuscript establishes it, but has other meanings. Antimony can refer to ore or regulus, arsenic often to trioxide, and vitriol to sulfate families. None identifies an actual specimen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="785" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">ALCHEMY → ELEMENTS / SOURCE-BOUND MAPPING</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A name is not an assay</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Historically attested words and signs are context-sensitive; these are modern candidates, not tested specimens.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><text x="67" y="177" fill="#087f73" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">HISTORICAL WITNESS</text><text x="405" y="177" fill="#2563a6" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CANDIDATE MODERN IDENTITY</text><text x="790" y="177" fill="#bc6836" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">WHAT REMAINS UNKNOWN</text><rect x="54" y="195" width="1092" height="76" rx="10" fill="#fff" stroke="#e2eaf0"/><text x="70" y="228" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">☉ / gold · conventional sign</text><text x="405" y="228" fill="#2563a6" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Au · gold, if literal metal</text><text x="790" y="228" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Manuscript context uncollated here</text><text x="70" y="252" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">historical expression</text><text x="405" y="252" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">editorial mapping, context-limited</text><text x="790" y="252" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">element / phase / composition unresolved</text><rect x="54" y="284" width="1092" height="76" rx="10" fill="#eff5f8" stroke="#e2eaf0"/><text x="70" y="317" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">♄ / Saturn · contextual term</text><text x="405" y="317" fill="#2563a6" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Pb · only if passage establishes lead</text><text x="790" y="317" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Can also signify aqua fortis elsewhere</text><text x="70" y="341" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">historical expression</text><text x="405" y="341" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">editorial mapping, context-limited</text><text x="790" y="341" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">element / phase / composition unresolved</text><rect x="54" y="373" width="1092" height="76" rx="10" fill="#fff" stroke="#e2eaf0"/><text x="70" y="406" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">antimony · ore or regulus</text><text x="405" y="406" fill="#2563a6" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Sb₂S₃ ore / Sb-rich metal candidate</text><text x="790" y="406" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Ore, metal or alloy? Sample required</text><text x="70" y="430" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">historical expression</text><text x="405" y="430" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">editorial mapping, context-limited</text><text x="790" y="430" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">element / phase / composition unresolved</text><rect x="54" y="462" width="1092" height="76" rx="10" fill="#eff5f8" stroke="#e2eaf0"/><text x="70" y="495" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">arsenic · early-modern usage</text><text x="405" y="495" fill="#2563a6" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">often As₂O₃, not elemental As</text><text x="790" y="495" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Historical usage varies by passage</text><text x="70" y="519" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">historical expression</text><text x="405" y="519" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">editorial mapping, context-limited</text><text x="790" y="519" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">element / phase / composition unresolved</text><rect x="54" y="551" width="1092" height="76" rx="10" fill="#fff" stroke="#e2eaf0"/><text x="70" y="584" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">vitriol · family label</text><text x="405" y="584" fill="#2563a6" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Fe / Cu sulfate family candidates</text><text x="790" y="584" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Which cation, hydration and mixture?</text><text x="70" y="608" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">historical expression</text><text x="405" y="608" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">editorial mapping, context-limited</text><text x="790" y="608" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">element / phase / composition unresolved</text><line x1="54" y1="660" x2="1146" y2="660" stroke="#e2eaf0" stroke-width="2"/><text x="65" y="691" fill="#163044" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A conventional symbol is a candidate reading; a primary passage must establish a literal substance.</text><text x="65" y="722" fill="#bc6836" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Compound, phase and purity still require measurement. Color or code-word cannot establish transmutation.</text><text x="65" y="758" fill="#506477" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Source trail: primary manuscript index; separate editorial symbols/glossary (V3-NEWTON-INDEX / SYMBOLS / GLOSSARY).</text></svg>