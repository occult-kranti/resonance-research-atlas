<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 755" width="1200" height="755" role="img" aria-labelledby="title desc"><title id="title">Proposed speaker, card reflector and phone plan</title><desc id="desc">Top view: speaker S at (0,0) metres, phone microphone M at (0.50,0), a nominal 0.90-m-wide movable card on y=0.60 m. Direct and illustrative reflected paths, signal chain and placement controls. Proposed and unbuilt; no measured delay.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="755" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">S1 PROPOSED BENCH / TOP VIEW</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Speaker · reflector · phone</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Nominal placement in metres. Unbuilt; the synthetic S1A 5 ms path is not a room measurement.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><text x="70" y="177" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">PLACEMENT</text><line x1="130" y1="255" x2="685" y2="255" stroke="#bc6836" stroke-width="12"/><text x="408" y="232" fill="#bc6836" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">movable stiff card, 0.90 m nominal width</text><line x1="252" y1="585" x2="552" y2="585" stroke="#2563a6" stroke-width="4"/><line x1="252" y1="585" x2="402" y2="255" stroke="#087f73" stroke-width="3" stroke-dasharray="9 7"/><line x1="402" y1="255" x2="552" y2="585" stroke="#087f73" stroke-width="3" stroke-dasharray="9 7"/><text x="389" y="442" fill="#087f73" font-size="14" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">illustrative reflected path</text><circle cx="252" cy="585" r="29" fill="#e7f1fc" stroke="#2563a6" stroke-width="3"/><text x="252" y="591" fill="#2563a6" font-size="19" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">S</text><rect x="525" y="558" width="54" height="54" rx="9" fill="#e5f5f2" stroke="#087f73" stroke-width="3"/><text x="552" y="590" fill="#087f73" font-size="19" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">M</text><text x="250" y="631" fill="#163044" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">ordinary speaker</text><text x="551" y="631" fill="#163044" font-size="15" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">phone mic port → S</text><line x1="295" y1="585" x2="505" y2="585" stroke="#2563a6" stroke-width="3" marker-end="url(#blueArrow)"/><text x="402" y="565" fill="#2563a6" font-size="14" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">direct path</text><line x1="252" y1="666" x2="552" y2="666" stroke="#163044" stroke-width="1.5"/><line x1="252" y1="657" x2="252" y2="675" stroke="#163044" stroke-width="1.5"/><line x1="552" y1="657" x2="552" y2="675" stroke="#163044" stroke-width="1.5"/><text x="402" y="693" fill="#163044" font-size="16" font-weight="bold" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">S–M = 0.50 m</text><line x1="718" y1="255" x2="718" y2="585" stroke="#163044" stroke-width="1.5"/><line x1="708" y1="255" x2="728" y2="255" stroke="#163044" stroke-width="1.5"/><line x1="708" y1="585" x2="728" y2="585" stroke="#163044" stroke-width="1.5"/><text x="706" y="429" fill="#163044" font-size="15" font-weight="bold" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif">0.60 m to card</text><text x="72" y="720" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Coordinates: S (0, 0); M (0.50, 0); card line y = 0.60, x = −0.20…0.70 m.</text><line x1="785" y1="173" x2="785" y2="723" stroke="#e2eaf0" stroke-width="2"/><text x="810" y="180" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">SIGNAL / READOUT</text><rect x="810" y="201" width="330" height="70" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="826" y="231" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Digital test signal</text><text x="826" y="257" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">output level logged</text><line x1="974" y1="271" x2="974" y2="293" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="303" width="330" height="70" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="826" y="333" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Speaker + room</text><text x="826" y="359" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">both are unknown transfer paths</text><line x1="974" y1="373" x2="974" y2="395" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="810" y="405" width="330" height="70" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="826" y="435" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Phone + recorder</text><text x="826" y="461" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">gain mode / rate documented</text><text x="810" y="515" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Matched placements</text><text x="810" y="544" fill="#506477" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">no card → card → no card</text><text x="810" y="566" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">+1 cm phone move, then restore</text><text x="810" y="592" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">A changed recording does not isolate</text><text x="810" y="616" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">the card from speaker, microphone,</text><text x="810" y="640" fill="#163044" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">gain, and other room reflections.</text><text x="810" y="701" fill="#bc6836" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Measure actual positions and room state.</text></svg>