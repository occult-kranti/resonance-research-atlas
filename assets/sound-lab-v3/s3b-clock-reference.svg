<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc"><title id="title">Synthetic timebase ambiguity and conditional independent clock reference</title><desc id="desc">Exact generated fixture has 16032 PCM16 samples at true times n divided by 8016 seconds. The WAV header labels those same amplitudes n divided by 8000, producing apparent 499.001996 hertz and decay 3.992016 per second. A corrected-time CSV recovers 500 hertz and 4 per second. A future 1000-hertz calibration source must be independently timed; no physical clock has been measured.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#163044"/></marker><marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2563a6"/></marker></defs><rect width="1200" height="760" fill="#f8fbfd"/><text x="54" y="48" fill="#087f73" font-size="14" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">S3B EXACT GENERATED-PCM FIXTURE</text><text x="54" y="86" fill="#163044" font-size="30" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">One sample series · two time axes</text><text x="54" y="115" fill="#506477" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Metadata can stretch inferred frequency and decay. No physical phone clock was measured.</text><line x1="54" y1="134" x2="1146" y2="134" stroke="#e2eaf0" stroke-width="2"/><rect x="72" y="198" width="325" height="138" rx="12" fill="#eef5fb" stroke="#e2eaf0" stroke-width="2"/><text x="88" y="228" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Generated PCM16 samples</text><text x="88" y="254" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">n = 0…16031; 16032 samples</text><text x="89" y="292" fill="#2563a6" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">fixture: 500 Hz, decay α = 4 s⁻¹</text><text x="89" y="314" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">true sampling interval = 1/8016 s</text><line x1="397" y1="258" x2="445" y2="258" stroke="#163044" stroke-width="2"/><line x1="445" y1="258" x2="445" y2="450" stroke="#163044" stroke-width="2"/><line x1="445" y1="257" x2="491" y2="257" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><line x1="445" y1="450" x2="491" y2="450" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="191" width="335" height="142" rx="12" fill="#fff5ed" stroke="#e5c6ac" stroke-width="2"/><text x="511" y="221" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">WAV header says 8000 Hz</text><text x="511" y="247" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">same quantized sample amplitudes</text><text x="511" y="286" fill="#bc6836" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">declared times tₕ = n / 8000 s</text><text x="511" y="311" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">header is wrong for this fixture</text><rect x="495" y="388" width="335" height="142" rx="12" fill="#eaf8f4" stroke="#b9dcd2" stroke-width="2"/><text x="511" y="418" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Corrected-time CSV</text><text x="511" y="444" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">same decoded sample amplitudes</text><text x="511" y="483" fill="#087f73" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">external times tₑ = n / 8016 s</text><text x="511" y="508" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">external here = known simulation grid</text><line x1="830" y1="263" x2="869" y2="263" stroke="#bc6836" stroke-width="2" marker-end="url(#arrow)"/><line x1="830" y1="461" x2="869" y2="461" stroke="#087f73" stroke-width="2" marker-end="url(#arrow)"/><rect x="875" y="191" width="270" height="142" rx="12" fill="#fff5ed" stroke="#e5c6ac" stroke-width="2"/><text x="891" y="221" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Predicted header-time fit</text><text x="891" y="247" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">499.001996 Hz</text><text x="890" y="288" fill="#bc6836" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">α = 3.992016 s⁻¹</text><rect x="875" y="388" width="270" height="142" rx="12" fill="#eaf8f4" stroke="#b9dcd2" stroke-width="2"/><text x="891" y="418" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Predicted corrected-time fit</text><text x="891" y="444" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">500 Hz</text><text x="890" y="486" fill="#087f73" font-size="15" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">α = 4 s⁻¹</text><line x1="72" y1="566" x2="1146" y2="566" stroke="#e2eaf0" stroke-width="2"/><text x="75" y="598" fill="#163044" font-size="17" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">CONDITIONAL FUTURE CLOCK CHECK</text><rect x="76" y="613" width="339" height="76" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="92" y="643" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Independent 1000 Hz reference</text><text x="92" y="669" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">must have verified external timing</text><line x1="415" y1="651" x2="463" y2="651" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="469" y="613" width="320" height="76" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="485" y="643" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Capture through same recorder</text><text x="485" y="669" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">compare measured reference to 1000 Hz</text><line x1="789" y1="651" x2="837" y2="651" stroke="#163044" stroke-width="2" marker-end="url(#arrow)"/><rect x="843" y="613" width="299" height="76" rx="12" fill="#fff" stroke="#e2eaf0" stroke-width="2"/><text x="859" y="643" fill="#163044" font-size="16" font-weight="bold" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Infer clock scale, conditionally</text><text x="859" y="669" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">same-clock file is circular</text><text x="75" y="729" fill="#506477" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter,Segoe UI,Arial,sans-serif">Control: true 8000 Hz null plus invalid-file, window and channel refusals. Raw bytes and acquisition metadata stay preserved.</text></svg>